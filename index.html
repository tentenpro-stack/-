<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#fff4f8"><title>もちっと！ポンポンパニック</title>
<style>
:root{--ink:#624c62}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:var(--ink);background:linear-gradient(#fff3f8,#f1f8ff 70%,#f6fff9);display:flex;justify-content:center;overscroll-behavior:none}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.app{width:min(100%,520px);padding:12px 0 24px}header{text-align:center;padding:8px 4px 12px}.logo{font-size:12px;letter-spacing:.15em;font-weight:900;color:#bd82a1}h1{font-size:clamp(28px,7vw,38px);line-height:1.15;margin:6px 0;color:#8c5d82}.sub{font-size:12px;color:#9b8298;margin:5px}.panel{background:#ffffffdf;border:2px solid white;box-shadow:0 8px 24px #d9bfd233;border-radius:24px;padding:14px;margin:10px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff6fa;border-radius:15px;text-align:center;padding:8px 4px}.stat small{display:block;font-size:11px;color:#a1849b;font-weight:700}.stat strong{font-size:24px;color:#855f81;font-variant-numeric:tabular-nums}.time strong{color:#e47ca7}.progress{height:8px;background:#f3eaf0;border-radius:20px;overflow:hidden;margin:10px 2px}.progress i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#a5dfd0,#ffb4cf)}.stage{position:relative;min-height:260px;border-radius:22px;background:radial-gradient(circle,#fff 0,#fff8fc 60%,#f0f8ff);border:2px dashed #f2d9e8;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:14px}.prompt{font-size:12px;font-weight:800;color:#a58aa1;margin-bottom:8px}.blob{width:126px;height:126px;border-radius:43% 57% 52% 48%/48% 43% 57% 52%;display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:inset -9px -10px 0 #0000000b,inset 7px 7px 0 #ffffff77,0 10px 18px #8b6a7a22;animation:wobble 1.4s ease-in-out infinite alternate}.blob:after{content:"";position:absolute;width:23px;height:11px;border-radius:50%;background:#fff9;top:17px;left:24px;transform:rotate(-25deg)}@keyframes wobble{to{transform:rotate(5deg) scale(1.03)}}.pink{background:#ffacd0}.blue{background:#9bd9f7}.yellow{background:#ffe18c}.instruction{font-size:13px;font-weight:800;margin:12px 0 2px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.choice{border:0;border-radius:18px;padding:12px 4px 10px;min-height:91px;color:#624c62;font-weight:900;box-shadow:0 5px 0 #00000012}.choice:active{transform:translateY(4px);box-shadow:0 1px 0 #00000012}.choice .basket{display:block;font-size:29px}.choice.pink{background:#ffe0ed}.choice.blue{background:#dff3ff}.choice.yellow{background:#fff0bf}.choice:disabled{opacity:.55}.actions{display:flex;gap:8px;margin-top:12px}.primary,.secondary{border:0;border-radius:16px;padding:14px 12px;font-weight:900}.primary{flex:1;color:white;background:linear-gradient(100deg,#ff8fba,#f27eb0);box-shadow:0 5px 0 #d96799}.secondary{background:#eef7fb;color:#66849a}.overlay{position:absolute;inset:0;background:#fffaf4ed;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;z-index:2}.overlay .big{font-size:48px}.overlay h2{margin:4px 0 7px;font-size:23px;color:#8c5d82}.overlay p{font-size:13px;line-height:1.65;color:#8f7b8e;margin:3px 0 12px}.overlay .primary{width:100%;max-width:250px;flex:none}.hidden{display:none!important}.feedback{height:22px;text-align:center;font-size:13px;font-weight:900;color:#d778a2;margin:7px}.bottomrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}.sound{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:#927b91}.sound button{border:0;background:#f7edf4;border-radius:12px;padding:8px 10px;color:#8c6684;font-weight:800}.sound input{width:76px;accent-color:#e887b1}.hint{font-size:11px;color:#a18b9e;line-height:1.6;text-align:center;margin:10px 4px}.result-score{font-size:42px;font-weight:1000;color:#e47ca7}.rank{display:inline-block;background:#fff0c9;color:#a17b36;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:900;margin:7px}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:9px}.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#745c75;color:white;border-radius:20px;padding:7px 13px;font-size:12px;opacity:0;pointer-events:none}.toast.show{opacity:1}@media(max-width:360px){.panel{padding:11px}.blob{width:108px;height:108px}.choice{min-height:82px}.sound input{width:58px}}
</style></head><body><main class="app"><header><div class="logo">MOCHI MOCHI ARCADE</div><h1>もちっと！<br>ポンポンパニック</h1><p class="sub">もちもちたちを、ぴったりのおうちへ！</p></header>
<section class="panel"><div class="stats"><div class="stat"><small>スコア</small><strong id="score">0</strong></div><div class="stat time"><small>のこり時間</small><strong id="time">45</strong></div><div class="stat"><small>コンボ</small><strong id="combo">0</strong></div></div><div class="progress"><i id="timebar"></i></div>
<div class="stage" id="stage"><div class="prompt">この子のおうちはどこ？</div><div class="blob pink" id="blob"><span id="face">●ᴗ●</span></div><div class="instruction">同じ色のおうちをタップ！</div><div class="toast" id="toast">ナイス！</div>
<div class="overlay" id="intro"><div class="big">🍡✨</div><h2>もちもちたちをお届け！</h2><p>出てきた子と同じ色のおうちをタップしよう。<br>正解でコンボ！まちがいはハートが減るよ。<br>45秒でどこまでスコアを伸ばせるかな？</p><button class="primary" id="start">あそぶ！</button></div>
<div class="overlay hidden" id="result"><div class="big" id="resultEmoji">🏆</div><h2 id="resultTitle">おつかれさま！</h2><div class="result-score" id="finalScore">0点</div><div class="rank" id="rank">もちもち見習い</div><p id="resultText">もう一回挑戦してみよう！</p><div class="result-actions"><button class="primary" id="again">もう一回！</button><button class="secondary" id="share">Xでシェア</button></div></div></div>
<div class="choices"><button class="choice pink" data-color="pink"><span class="basket">🧺</span>ピンク</button><button class="choice blue" data-color="blue"><span class="basket">🧺</span>ブルー</button><button class="choice yellow" data-color="yellow"><span class="basket">🧺</span>イエロー</button></div><div class="feedback" id="feedback">ハート ♥ ♥ ♥</div>
<div class="actions"><button class="secondary" id="howto">あそびかた</button><button class="secondary" id="soundToggle">🔊 サウンド ON</button></div><div class="bottomrow"><div class="sound"><label for="volume">音量</label><input id="volume" type="range" min="0" max="100" value="35"><span id="volumeText">35%</span></div><div class="sound">自己ベスト <strong id="best">0</strong></div></div></section><p class="hint">1プレイ約45秒・登録不要・無料。音が出ないときは本体の消音設定も確認してね。</p></main>
<script>(()=>{'use strict';const $=id=>document.getElementById(id),COLORS=['pink','blue','yellow'],FACES=['●ᴗ●','•ᴗ•','ᵔᴥᵔ','◕‿◕'];let score=0,combo=0,hearts=3,time=45,best=0,current='pink',running=false,timer=null,spawnTimer=null,round=0,lastScore=0,soundOn=true,volume=.35,audio=null;try{best=Number(localStorage.getItem('mochipon_best')||0)}catch(e){}$('best').textContent=best;
function initAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audio)audio=new AC();if(audio.state==='suspended')audio.resume()}
function beep(f,d=.11,w='sine',v=.18){if(!soundOn||!audio)return;const o=audio.createOscillator(),g=audio.createGain(),n=audio.currentTime;o.type=w;o.frequency.setValueAtTime(f,n);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(Math.max(.0001,v*volume),n+.012);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(audio.destination);o.start(n);o.stop(n+d+.02)}
function happy(){beep(660);setTimeout(()=>beep(880,.12),65)}function wrong(){beep(190,.2,'triangle',.22)}
function update(){$('score').textContent=score.toLocaleString();$('combo').textContent=combo;$('time').textContent=time;$('timebar').style.width=(time/45*100)+'%';$('best').textContent=best.toLocaleString();$('feedback').textContent='ハート '+'♥ '.repeat(hearts)+'♡ '.repeat(3-hearts)}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),480)}
function nextBlob(){if(!running)return;round++;let n=COLORS[Math.floor(Math.random()*3)];if(round%7===0)n=COLORS[(COLORS.indexOf(current)+1)%3];current=n;$('blob').className='blob '+current;$('face').textContent=FACES[Math.floor(Math.random()*FACES.length)];let delay=Math.max(390,1050-Math.floor(score/180)*55);clearTimeout(spawnTimer);spawnTimer=setTimeout(()=>{if(!running)return;combo=0;hearts--;wrong();toast('あれれ！お引っ越し失敗');update();if(hearts<=0)finish();else nextBlob()},Math.max(1700,delay*1.75))}
function choose(c){if(!running)return;clearTimeout(spawnTimer);if(c===current){combo++;let p=10+Math.min(combo,15)*2;score+=p;happy();toast(combo>=5?'✨ '+combo+'コンボ！ +'+p:'ナイス！ +'+p)}else{combo=0;hearts--;wrong();toast('おしい！');if(hearts<=0){update();finish();return}}update();nextBlob()}
function start(){initAudio();score=0;combo=0;hearts=3;time=45;round=0;running=true;$('intro').classList.add('hidden');$('result').classList.add('hidden');document.querySelectorAll('.choice').forEach(b=>b.disabled=false);update();nextBlob();clearInterval(timer);timer=setInterval(()=>{time--;update();if(time<=0)finish()},1000)}
function finish(){if(!running)return;running=false;clearInterval(timer);clearTimeout(spawnTimer);document.querySelectorAll('.choice').forEach(b=>b.disabled=true);lastScore=score;let record=score>best;if(record){best=score;try{localStorage.setItem('mochipon_best',String(best))}catch(e){}}let rank='もちもち見習い',emoji='🍡';if(score>=700){rank='伝説のもちマスター';emoji='👑'}else if(score>=450){rank='ポンポン達人';emoji='🏆'}else if(score>=250){rank='もちもち上級者';emoji='🌟'}$('resultEmoji').textContent=emoji;$('resultTitle').textContent=record?'自己ベスト更新！！':'おつかれさま！';$('finalScore').textContent=score.toLocaleString()+'点';$('rank').textContent=rank;$('resultText').textContent=(record?'新しい記録がうまれたよ！':'自己ベスト '+best.toLocaleString()+'点！')+' もう一度挑戦してみよう！';$('result').classList.remove('hidden');update();beep(784,.18);setTimeout(()=>beep(988,.22),150)}
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.color)));$('start').addEventListener('click',start);$('again').addEventListener('click',start);$('howto').addEventListener('click',()=>$('intro').classList.remove('hidden'));$('soundToggle').addEventListener('click',()=>{soundOn=!soundOn;$('soundToggle').textContent=soundOn?'🔊 サウンド ON':'🔇 サウンド OFF';if(soundOn)initAudio()});$('volume').addEventListener('input',e=>{volume=Number(e.target.value)/100;$('volumeText').textContent=e.target.value+'%'});
$('share').addEventListener('click',()=>{let msg='もちっと！ポンポンパニックで'+lastScore.toLocaleString()+'点だったよ！🍡\\n自己ベスト更新を目指して挑戦してみてね！\\n'+location.href+'\\n#もちポンチャレンジ';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(msg),'_blank','noopener,noreferrer')});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&audio&&audio.state==='running')audio.suspend()});update()})();</script></body></html>
